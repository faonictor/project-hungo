spring.application.name=hungo

# usuário e senha de conexao com o banco de dados
spring.datasource.username=root
spring.datasource.password=root

# url de conexao do banco de dados (com criacao automatica do banco 'hungo')
spring.datasource.url=jdbc:mysql://localhost:3306/hungo?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=America/Sao_Paulo

# Configuração de Timezone para Jackson JSON
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt_BR

# Dialeto do banco de dados
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# criando tabelas automatico
spring.jpa.hibernate.ddl-auto=update

# Povoamento e inicializacao automatica do banco de dados (data.sql com encoding UTF-8)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# configuracao de encoding no Hibernate
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.charSet=UTF-8

# configuracao do Hibernate para reconhecer o nome de tabelas em caixa alta
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# configuracoes de log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# spring Security
#logging.level.org.springframework.security=DEBUG